name: Symfony + PHP - WR506D

on:
    push:
        branches: [ "develop", "main" ]
    pull_request:
        branches: [ "develop", "main" ]

permissions:
    contents: read

jobs:
    symfony-tests:
        runs-on: ubuntu-latest
        steps:
            # Setup PHP
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'

            # Récupération du code
            - uses: actions/checkout@v3

            # Gestion du fichier .env pour les tests
            - name: Copy .env.test.local
              run: php -r "if(file_exists('.env.test')) { copy('.env.test', '.env.test.local'); } else { echo '.env.test missing'; }"

            # Cache pour accélérer les futurs lancements
            - name: Cache Composer packages
              id: composer-cache
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-

            # Installation des dépendances du projet
            - name: Install Dependencies
              run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

            # Préparation de la base de données SQLite (fichier temporaire)
            - name: Create Database
              run: |
                  mkdir -p data
                  touch data/database.sqlite

            # Lancement des tests
            - name: Execute tests via PHPUnit
              env:
                  DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
              run: vendor/bin/phpunit

            # --- Outils de qualité de code

            # Vérifie le style du code (PSR2)
            - name: Run PHP_CodeSniffer
              run: vendor/bin/phpcs --standard=PSR2 src/ --ignore=src/Kernel.php

            # Analyse statique (bugs potentiels)
            - name: Run PHPStan
              run: vendor/bin/phpstan analyze src/ --memory-limit=1G

            # Détection de code "sale"
            - name: Run PHPMD
              run: vendor/bin/phpmd src/ text cleancode,codesize,controversial,design
